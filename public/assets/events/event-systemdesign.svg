<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0A0F1D"/>
  <!-- System Architecture Boxes -->
  <g transform="translate(140, 90)">
    <rect width="520" height="270" rx="10" fill="#0F172A" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Load Balancer -->
    <rect x="40" y="90" width="90" height="70" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="85" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">LB Cluster</text>
    <text x="85" y="140" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">RoundRobin</text>

    <!-- App Servers -->
    <rect x="210" y="40" width="100" height="50" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
    <text x="260" y="70" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">API Node 1</text>

    <rect x="210" y="105" width="100" height="50" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
    <text x="260" y="135" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">API Node 2</text>

    <rect x="210" y="170" width="100" height="50" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
    <text x="260" y="200" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">API Node 3</text>

    <!-- Cache & DB -->
    <rect x="380" y="50" width="100" height="60" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="430" y="85" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Redis Cache</text>

    <rect x="380" y="150" width="100" height="60" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="430" y="185" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Sharded DB</text>

    <!-- Connectors -->
    <line x1="130" y1="125" x2="210" y2="65" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="130" y1="125" x2="210" y2="130" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="130" y1="125" x2="210" y2="195" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <g transform="translate(60, 40)">
    <rect width="180" height="28" rx="6" fill="rgba(148, 163, 184, 0.15)" stroke="rgba(148, 163, 184, 0.4)" stroke-width="1"/>
    <text x="90" y="18" fill="#CBD5E1" font-family="system-ui, sans-serif" font-weight="700" font-size="10" letter-spacing="1" text-anchor="middle">SYSTEM DESIGN • SCALE</text>
  </g>
</svg>
