<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0A0E1A"/>
  <!-- Ambient Geometry -->
  <defs>
    <linearGradient id="event-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Giant Hackathon Shield & Code Bracket -->
  <g transform="translate(400, 210)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1.5" stroke-dasharray="8 8"/>
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- Trophy / Lightning -->
    <path d="M-15 -30 L10 -5 L-5 5 L15 30 L-10 10 L5 0 Z" fill="#38BDF8"/>
  </g>

  <!-- Event Header Details -->
  <g transform="translate(60, 60)">
    <rect width="180" height="32" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="90" y="21" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1" text-anchor="middle">FLAGSHIP HACKATHON</text>

    <text x="0" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="32" letter-spacing="1">HACKCODEX 2026</text>
    <text x="0" y="105" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="500" font-size="16">36 Hours • $15,000+ Prize Pool • 600+ Builders</text>
  </g>

  <rect x="60" y="370" width="280" height="34" rx="6" fill="#1E293B"/>
  <text x="75" y="392" fill="#E2E8F0" font-family="monospace" font-size="11">● OCTOBER 24-25, 2026 • HYBRID</text>
</svg>
