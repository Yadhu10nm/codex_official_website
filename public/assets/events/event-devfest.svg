<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#080D1A"/>
  <!-- Sprint Rocket & Stopwatch Graphic -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="100" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M0 -70 V0 H40" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#38BDF8"/>
    <text x="0" y="45" fill="#E2E8F0" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">12:00:00</text>
  </g>

  <g transform="translate(60, 60)">
    <rect width="160" height="32" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="80" y="21" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1" text-anchor="middle">SPRING SPRINT</text>

    <text x="0" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="30">Codex DevFest 2026</text>
    <text x="0" y="105" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="500" font-size="15">12-Hour Rapid Product Prototype Sprint</text>
  </g>

  <rect x="60" y="370" width="280" height="34" rx="6" fill="#1E293B"/>
  <text x="75" y="392" fill="#E2E8F0" font-family="monospace" font-size="11">● MARCH 29, 2026 • IN-PERSON</text>
</svg>
