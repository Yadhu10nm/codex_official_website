<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#070C16"/>
  <!-- 3D Shader Torus / Wireframe Visualization -->
  <g transform="translate(400, 225)">
    <!-- Wireframe Rings -->
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="none" stroke="#38BDF8" stroke-width="2" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="none" stroke="#818CF8" stroke-width="1.8" transform="rotate(35)"/>
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="none" stroke="#94A3B8" stroke-width="1.2" transform="rotate(90)"/>
    <circle cx="0" cy="0" r="30" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="0" y="5" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">GLSL</text>
  </g>

  <!-- Event Header Details -->
  <g transform="translate(60, 60)">
    <rect width="160" height="32" rx="6" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1"/>
    <text x="80" y="21" fill="#818CF8" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1" text-anchor="middle">HANDS-ON WORKSHOP</text>

    <text x="0" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="30">WebGL &amp; Three.js Masterclass</text>
    <text x="0" y="105" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="500" font-size="15">Custom GLSL Shaders • Creative Web Graphics</text>
  </g>

  <rect x="60" y="370" width="280" height="34" rx="6" fill="#1E293B"/>
  <text x="75" y="392" fill="#E2E8F0" font-family="monospace" font-size="11">● SEPTEMBER 18, 2026 • LAB 4B</text>
</svg>
