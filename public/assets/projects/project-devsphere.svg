<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0A0E18"/>
  <!-- In-Browser IDE Mockup -->
  <g transform="translate(80, 60)">
    <rect width="640" height="330" rx="10" fill="#0F172A" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <!-- Tab bar -->
    <rect width="640" height="36" rx="10" fill="#1E293B"/>
    <rect x="10" y="6" width="130" height="26" rx="5" fill="#0F172A"/>
    <text x="75" y="23" fill="#E2E8F0" font-family="monospace" font-size="10" text-anchor="middle">App.tsx</text>
    <rect x="150" y="6" width="130" height="26" rx="5" fill="rgba(15, 23, 42, 0.4)"/>
    <text x="215" y="23" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">engine.rs</text>

    <!-- Multiplayer Cursors -->
    <text x="480" y="24" fill="#38BDF8" font-family="monospace" font-size="10">● 4 Builders Connected</text>

    <!-- Editor Body Lines -->
    <g transform="translate(30, 60)" font-family="monospace" font-size="12">
      <text x="0" y="20" fill="#94A3B8">01</text>
      <text x="30" y="20" fill="#F43F5E">import</text>
      <text x="80" y="20" fill="#E2E8F0">{ createEngine } from</text>
      <text x="250" y="20" fill="#10B981">'@codex/core'</text>

      <text x="0" y="50" fill="#94A3B8">02</text>
      <text x="30" y="50" fill="#38BDF8">const</text>
      <text x="75" y="50" fill="#FBBF24">sandbox</text>
      <text x="140" y="50" fill="#E2E8F0">= await createEngine({</text>

      <text x="0" y="80" fill="#94A3B8">03</text>
      <text x="60" y="80" fill="#E2E8F0">runtime: <tspan fill="#10B981">'wasm-v8'</tspan>, isolation: <tspan fill="#818CF8">true</tspan></text>

      <text x="0" y="110" fill="#94A3B8">04</text>
      <text x="30" y="110" fill="#E2E8F0">});</text>

      <!-- Cursor 1 -->
      <rect x="360" y="65" width="2" height="18" fill="#38BDF8"/>
      <rect x="360" y="50" width="48" height="15" rx="3" fill="#38BDF8"/>
      <text x="384" y="61" fill="#0F172A" font-size="8" font-weight="700" text-anchor="middle">Diya</text>

      <!-- Cursor 2 -->
      <rect x="230" y="95" width="2" height="18" fill="#F59E0B"/>
      <rect x="230" y="80" width="52" height="15" rx="3" fill="#F59E0B"/>
      <text x="256" y="91" fill="#0F172A" font-size="8" font-weight="700" text-anchor="middle">Aarav</text>
    </g>

    <!-- Terminal Drawer -->
    <rect x="10" y="210" width="620" height="110" rx="8" fill="#020617" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <text x="25" y="235" fill="#38BDF8" font-family="monospace" font-size="11">➜ devsphere-cluster: docker container started [38ms]</text>
    <text x="25" y="260" fill="#10B981" font-family="monospace" font-size="11">✔ Server listening on https://sandbox-829.codex.edu:3000</text>
  </g>

  <rect x="50" y="40" width="220" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <text x="160" y="62" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">WEB IDE • CRDT MULTIPLAYER</text>
</svg>
