<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#080D18"/>
  <!-- Biometric Telemetry Graph -->
  <g transform="translate(100, 70)">
    <rect width="600" height="310" rx="12" fill="#0F172A" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Waveform ECG trace -->
    <path d="M40 160 L140 160 L160 140 L175 190 L195 90 L215 220 L230 150 L250 160 L360 160 L380 140 L395 190 L415 90 L435 220 L450 150 L470 160 L560 160" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Secondary metric line -->
    <path d="M40 240 Q140 220 240 250 T440 230 T560 240" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-dasharray="3 3"/>

    <!-- Metric HUD Tiles -->
    <g transform="translate(40, 30)">
      <rect width="160" height="50" rx="8" fill="#1E293B"/>
      <text x="15" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">HEART RATE (BPM)</text>
      <text x="15" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="18">72 <tspan fill="#10B981" font-size="11">Optimal</tspan></text>
    </g>

    <g transform="translate(220, 30)">
      <rect width="160" height="50" rx="8" fill="#1E293B"/>
      <text x="15" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">HRV SCORE</text>
      <text x="15" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="18">88 <tspan fill="#38BDF8" font-size="11">ms</tspan></text>
    </g>

    <g transform="translate(400, 30)">
      <rect width="160" height="50" rx="8" fill="#1E293B"/>
      <text x="15" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">BLE TELEMETRY</text>
      <text x="15" y="44" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="14">SYNCED 120Hz</text>
    </g>
  </g>

  <rect x="50" y="40" width="220" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <text x="160" y="62" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">BIOMETRIC • IOT TELEMETRY</text>
</svg>
