<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#090D16"/>
  <!-- Ambient Grid -->
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grid1)"/>

  <!-- Neural AST Tree Visualization -->
  <g transform="translate(100, 70)">
    <!-- Terminal Window -->
    <rect width="600" height="310" rx="12" fill="url(#grad1)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <rect width="600" height="36" rx="12" fill="rgba(15, 23, 42, 0.8)"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="52" cy="18" r="5" fill="#10B981" opacity="0.8"/>
    <text x="300" y="22" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">aetheris-ast-transformer.ts</text>

    <!-- Code / Node nodes -->
    <g transform="translate(40, 60)">
      <circle cx="260" cy="40" r="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <text x="260" y="44" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Root</text>

      <line x1="260" y1="56" x2="160" y2="110" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <line x1="260" y1="56" x2="360" y2="110" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>

      <circle cx="160" cy="120" r="14" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
      <text x="160" y="124" fill="#818CF8" font-family="monospace" font-size="9" text-anchor="middle">AST</text>

      <circle cx="360" cy="120" r="14" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
      <text x="360" y="124" fill="#818CF8" font-family="monospace" font-size="9" text-anchor="middle">LLM</text>

      <line x1="160" y1="134" x2="100" y2="180" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5"/>
      <line x1="160" y1="134" x2="210" y2="180" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5"/>
      <line x1="360" y1="134" x2="310" y2="180" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5"/>
      <line x1="360" y1="134" x2="420" y2="180" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5"/>

      <rect x="70" y="180" width="60" height="24" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="1"/>
      <text x="100" y="195" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">Token</text>

      <rect x="180" y="180" width="60" height="24" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="1"/>
      <text x="210" y="195" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">Scope</text>

      <rect x="280" y="180" width="60" height="24" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="1"/>
      <text x="310" y="195" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">Infer</text>

      <rect x="390" y="180" width="60" height="24" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="1"/>
      <text x="420" y="195" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">Emit</text>
    </g>
  </g>

  <!-- Overlay badge -->
  <rect x="130" y="340" width="160" height="30" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="210" y="359" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">AI • AST TRANSFORMER</text>
</svg>
