<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0A0E17"/>
  <!-- Distributed Broker Cluster Diagram -->
  <g transform="translate(100, 80)">
    <rect width="600" height="290" rx="12" fill="#0F172A" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Leader Node -->
    <g transform="translate(140, 145)">
      <circle cx="0" cy="0" r="44" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
      <text x="0" y="-5" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">LEADER</text>
      <text x="0" y="14" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Node 01</text>
    </g>

    <!-- Follower Nodes -->
    <g transform="translate(420, 65)">
      <circle cx="0" cy="0" r="36" fill="#1E293B" stroke="#94A3B8" stroke-width="1.8"/>
      <text x="0" y="-3" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">FOLLOWER</text>
      <text x="0" y="12" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">Node 02</text>
    </g>

    <g transform="translate(420, 225)">
      <circle cx="0" cy="0" r="36" fill="#1E293B" stroke="#94A3B8" stroke-width="1.8"/>
      <text x="0" y="-3" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">FOLLOWER</text>
      <text x="0" y="12" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">Node 03</text>
    </g>

    <!-- Raft Log Streams -->
    <path d="M184 125 C260 90, 320 75, 384 68" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M184 165 C260 200, 320 215, 384 222" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Metrics Bar -->
    <rect x="40" y="240" width="200" height="24" rx="6" fill="#1E293B"/>
    <text x="50" y="256" fill="#10B981" font-family="monospace" font-size="10">250K msg/sec • Raft OK</text>
  </g>

  <rect x="50" y="40" width="220" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <text x="160" y="62" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">DISTRIBUTED • RAFT BROKER</text>
</svg>
